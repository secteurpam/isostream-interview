<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="OBS Settings window: Advanced tab, Sources section, Enable Browser Source Hardware Acceleration ticked">
  <rect width="880" height="470" rx="14" fill="#f4f5f7"/>
  <!-- window -->
  <rect x="24" y="24" width="832" height="422" rx="10" fill="#2b2e38" stroke="#1c1e25"/>
  <rect x="24" y="24" width="832" height="36" rx="10" fill="#22252d"/>
  <rect x="24" y="48" width="832" height="12" fill="#22252d"/>
  <circle cx="46" cy="42" r="6" fill="#ff5f57"/><circle cx="66" cy="42" r="6" fill="#febc2e"/><circle cx="86" cy="42" r="6" fill="#28c840"/>
  <text x="440" y="47" fill="#c9ccd6" font-size="14" text-anchor="middle">Settings</text>
  <!-- sidebar -->
  <rect x="24" y="60" width="180" height="386" fill="#252831"/>
  <g font-size="14" fill="#c9ccd6">
    <text x="48" y="94">General</text>
    <text x="48" y="126">Stream</text>
    <text x="48" y="158">Output</text>
    <text x="48" y="190">Audio</text>
    <text x="48" y="222">Video</text>
    <text x="48" y="254">Hotkeys</text>
    <text x="48" y="286">Accessibility</text>
  </g>
  <rect x="34" y="300" width="160" height="30" rx="6" fill="#3d6df2"/>
  <text x="48" y="320" font-size="14" font-weight="700" fill="#fff">Advanced</text>
  <circle cx="178" cy="315" r="13" fill="#ffb020"/><text x="178" y="320" font-size="14" font-weight="800" fill="#1b1d23" text-anchor="middle">2</text>
  <!-- content -->
  <g font-size="13" fill="#8d92a3" font-weight="700" letter-spacing="1">
    <text x="236" y="96">GENERAL</text>
    <text x="236" y="196">VIDEO</text>
    <text x="236" y="296">SOURCES</text>
  </g>
  <g font-size="14" fill="#c9ccd6">
    <text x="256" y="128">Process Priority</text><rect x="470" y="112" width="200" height="24" rx="5" fill="#363a46"/><text x="482" y="129" fill="#e6e8ee">Normal</text>
    <text x="256" y="162">Renderer</text><rect x="470" y="146" width="200" height="24" rx="5" fill="#363a46"/><text x="482" y="163" fill="#e6e8ee">Metal / Direct3D 11</text>
    <text x="256" y="228">Color Format</text><rect x="470" y="212" width="200" height="24" rx="5" fill="#363a46"/><text x="482" y="229" fill="#e6e8ee">NV12 (8-bit, 4:2:0)</text>
  </g>
  <!-- highlighted checkbox -->
  <rect x="242" y="312" width="470" height="44" rx="8" fill="#3d6df2" fill-opacity="0.16" stroke="#ffb020" stroke-width="2.5"/>
  <rect x="258" y="323" width="22" height="22" rx="5" fill="#3d6df2"/>
  <path d="M263 334 l5 5 l9 -11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="292" y="340" font-size="15" font-weight="700" fill="#ffffff">Enable Browser Source Hardware Acceleration</text>
  <circle cx="712" cy="312" r="13" fill="#ffb020"/><text x="712" y="317" font-size="14" font-weight="800" fill="#1b1d23" text-anchor="middle">3</text>
  <!-- buttons -->
  <rect x="610" y="398" width="100" height="32" rx="6" fill="#363a46"/><text x="660" y="419" font-size="14" fill="#e6e8ee" text-anchor="middle">Cancel</text>
  <rect x="722" y="398" width="116" height="32" rx="6" fill="#3d6df2"/><text x="780" y="419" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Apply / OK</text>
  <circle cx="838" cy="398" r="13" fill="#ffb020"/><text x="838" y="403" font-size="14" font-weight="800" fill="#1b1d23" text-anchor="middle">4</text>
  <!-- step 1 hint -->
  <rect x="236" y="384" width="330" height="48" rx="8" fill="#1f222a"/>
  <circle cx="258" cy="408" r="13" fill="#ffb020"/><text x="258" y="413" font-size="14" font-weight="800" fill="#1b1d23" text-anchor="middle">1</text>
  <text x="280" y="404" font-size="13" fill="#e6e8ee">Mac: OBS menu → Settings</text>
  <text x="280" y="422" font-size="13" fill="#e6e8ee">Windows/Linux: File → Settings</text>
</svg>

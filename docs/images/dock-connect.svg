<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Four steps in the Interview dock: connect account, confirm code in browser, pick a show, start interview and share the guest link">
  <rect width="900" height="400" rx="14" fill="#f4f5f7"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#9aa0ae"/></marker>
  </defs>
  <!-- panel template: x offsets 20, 245, 470, 695 ; width 185 -->
  <g>
    <rect x="20" y="20" width="185" height="320" rx="12" fill="#1b1d23"/>
    <text x="36" y="48" font-size="12" font-weight="700" fill="#8d92a3" letter-spacing="1">INTERVIEW</text>
    <rect x="34" y="70" width="157" height="150" rx="10" fill="#262932"/>
    <text x="46" y="96" font-size="13" font-weight="700" fill="#fff">Connect your</text>
    <text x="46" y="114" font-size="13" font-weight="700" fill="#fff">account</text>
    <text x="46" y="138" font-size="11" fill="#a3a8b6">Your browser opens</text>
    <text x="46" y="153" font-size="11" fill="#a3a8b6">to sign in.</text>
    <rect x="46" y="170" width="133" height="34" rx="8" fill="#3d6df2" stroke="#ffb020" stroke-width="2.5"/>
    <text x="112" y="192" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Connect account</text>
    <text x="46" y="246" font-size="11" fill="#7d8291">I have a studio key</text>
  </g>
  <g>
    <rect x="245" y="20" width="185" height="320" rx="12" fill="#ffffff" stroke="#d9dce3"/>
    <rect x="245" y="20" width="185" height="28" rx="12" fill="#e9ebf0"/><rect x="245" y="36" width="185" height="12" fill="#e9ebf0"/>
    <text x="337" y="39" font-size="10" fill="#6b7080" text-anchor="middle">your web browser</text>
    <text x="261" y="80" font-size="13" font-weight="700" fill="#1b1d23">Sign in, then confirm</text>
    <text x="261" y="98" font-size="13" font-weight="700" fill="#1b1d23">the code from OBS</text>
    <rect x="261" y="118" width="153" height="50" rx="8" fill="#f0f2f6" stroke="#ffb020" stroke-width="2.5"/>
    <text x="337" y="151" font-size="20" font-weight="800" fill="#1b1d23" text-anchor="middle" letter-spacing="2">K7QX-4MRT</text>
    <rect x="261" y="184" width="153" height="32" rx="8" fill="#3d6df2"/>
    <text x="337" y="205" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Approve</text>
  </g>
  <g>
    <rect x="470" y="20" width="185" height="320" rx="12" fill="#1b1d23"/>
    <text x="486" y="48" font-size="12" font-weight="700" fill="#8d92a3" letter-spacing="1">YOUR SHOWS</text>
    <rect x="484" y="66" width="157" height="44" rx="8" fill="#262932" stroke="#ffb020" stroke-width="2.5"/>
    <text x="496" y="86" font-size="12" font-weight="700" fill="#fff">Morning Talk</text>
    <text x="496" y="102" font-size="10" fill="#a3a8b6">Free plan · 2 guests</text>
    <rect x="484" y="118" width="157" height="44" rx="8" fill="#262932"/>
    <text x="496" y="138" font-size="12" font-weight="700" fill="#fff">Friday Panel</text>
    <text x="496" y="154" font-size="10" fill="#a3a8b6">one link, every episode</text>
    <rect x="484" y="174" width="157" height="32" rx="8" fill="#363a46"/>
    <text x="562" y="195" font-size="12" font-weight="700" fill="#e6e8ee" text-anchor="middle">+ New show</text>
  </g>
  <g>
    <rect x="695" y="20" width="185" height="320" rx="12" fill="#1b1d23"/>
    <text x="711" y="48" font-size="12" font-weight="700" fill="#8d92a3" letter-spacing="1">MORNING TALK</text>
    <rect x="709" y="66" width="157" height="34" rx="8" fill="#3d6df2" stroke="#ffb020" stroke-width="2.5"/>
    <text x="787" y="88" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Start interview</text>
    <text x="711" y="128" font-size="11" fill="#a3a8b6">Guest link</text>
    <rect x="709" y="136" width="157" height="30" rx="8" fill="#262932"/>
    <text x="719" y="155" font-size="10.5" fill="#e6e8ee">…/6a958c2df</text>
    <rect x="818" y="140" width="42" height="22" rx="6" fill="#363a46" stroke="#ffb020" stroke-width="2"/>
    <text x="839" y="155" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Copy</text>
    <rect x="709" y="180" width="75" height="44" rx="6" fill="#30343f"/><rect x="791" y="180" width="75" height="44" rx="6" fill="#30343f"/>
    <text x="746" y="206" font-size="10" fill="#7d8291" text-anchor="middle">You</text><text x="828" y="206" font-size="10" fill="#7d8291" text-anchor="middle">Guest</text>
  </g>
  <!-- arrows -->
  <path d="M207 180 H241" stroke="#9aa0ae" stroke-width="2" marker-end="url(#a)"/>
  <path d="M432 180 H466" stroke="#9aa0ae" stroke-width="2" marker-end="url(#a)"/>
  <path d="M657 180 H691" stroke="#9aa0ae" stroke-width="2" marker-end="url(#a)"/>
  <!-- step labels -->
  <g font-size="14" font-weight="700" fill="#1b1d23" text-anchor="middle">
    <circle cx="40" cy="370" r="13" fill="#ffb020"/><text x="40" y="375">1</text>
    <circle cx="265" cy="370" r="13" fill="#ffb020"/><text x="265" y="375">2</text>
    <circle cx="490" cy="370" r="13" fill="#ffb020"/><text x="490" y="375">3</text>
    <circle cx="715" cy="370" r="13" fill="#ffb020"/><text x="715" y="375">4</text>
  </g>
  <g font-size="13" fill="#2b2e38">
    <text x="60" y="375">Connect account</text>
    <text x="285" y="375">Approve the code</text>
    <text x="510" y="375">Pick or create a show</text>
    <text x="735" y="375">Start, share the link</text>
  </g>
</svg>
